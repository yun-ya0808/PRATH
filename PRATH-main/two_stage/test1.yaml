AUTO_RESUME: false
CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
DATA_DIR: ''
GPUS: (0,1)
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 8
seed: 0  # ====================================================
PRINT_FREQ: 50

DATASET:
  COLOR_RGB: false
  DATASET: 'coco'
  ROOT: '/data/coco/'
  # ROOT: '/home/newdisk2/S320080047/coco/'
  TEST_SET: 'val2017'
  TRAIN_SET: 'train2017'
  FLIP: true
  ROT_FACTOR: 40
  SCALE_FACTOR: 0.3
MODEL:
  INIT_WEIGHTS: true
  NAME: 'anchor_detr'
  BACKBONE: 'resnet50'
  DILATION: true
  TARGET_TYPE: 'coord'
  HEATMAP_SIZE:
  - 36
  - 48
  IMAGE_SIZE:
  - 288
  - 384
  NUM_JOINTS: 17
  NUM_FEATURE_LEVELS: 3
  LR_BACKBONE: 1e-5  # 这个不要删,是控制后面主干训练不训练的,这个大于0就会训练后面的主干
  EXTRA:
    ENC_LAYERS: 6
    DEC_LAYERS: 6
    DIM_FEEDFORWARD: 1024
    DROPOUT: 0.0
    NHEADS: 8
    NUM_QUERIES: 100
    NUM_QUERIES_PATTERN: 3
    spatial_prior: 'learned' # "grid"
    attention_type: "RCDA"
    LR_BACKBONE_NAMES: ["backbone"]
    LR_LINEAR_PROJ_NAMES: []
    LR_LINEAR_PROJ_MULT: 0.1
    HIDDEN_DIM: 256
    PRE_NORM: false
    AUX_LOSS: true
    EOS_COEF: 0.1
    KPT_LOSS_COEF: 5.0
LOSS:
  USE_TARGET_WEIGHT: true
  focal_alpha: 0.25
TRAIN:
  BATCH_SIZE_PER_GPU: 16
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 80
  OPTIMIZER: 'adamW'
  LR: 1.0e-4
  LR_BACKBONE: 1.0e-5
  CLIP_MAX_NORM: 0.1
  LR_FACTOR: 0.5
  LR_STEP:
  - 60
  - 70
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false
TEST:
  BATCH_SIZE_PER_GPU: 16
  COCO_BBOX_FILE: '/data/coco/person_detection_results/COCO_val2017_detr_detections.json'
  BBOX_THRE: 1.0
  IMAGE_THRE: 0.0
  IN_VIS_THRE: 0.2
  MODEL_FILE: ''
  NMS_THRE: 1.0
  OKS_THRE: 0.9
  FLIP_TEST: true
  POST_PROCESS: true
  SHIFT_HEATMAP: true
  USE_GT_BBOX: true
DEBUG:
  DEBUG: false
  SAVE_BATCH_IMAGES_GT: true
  SAVE_BATCH_IMAGES_PRED: true
  SAVE_HEATMAPS_GT: false
  SAVE_HEATMAPS_PRED: false
